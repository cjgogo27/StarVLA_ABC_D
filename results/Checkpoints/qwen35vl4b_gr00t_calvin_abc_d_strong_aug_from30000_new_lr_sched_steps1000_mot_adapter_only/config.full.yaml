run_id: qwen35vl4b_gr00t_calvin_abc_d_strong_aug_from30000_new_lr_sched_steps1000_mot_adapter_only
run_root_dir: ./results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Calvin
is_debug: false
version_id: '0.21'
framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /inspire/qb-ilm2/project/26summer-camp-10/public/two/Model/Qwen3.5-4B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
    future_action_window_size: 7
    past_action_window_size: 0
  motion_adapter:
    enabled: true
    history_window: 4
    hidden_dim: 512
    num_layers: 2
    num_heads: 8
    dropout: 0.1
    num_motion_tokens: 1
    use_state: true
    use_action: true
    pass_state_to_action_head: false
    state_dim: 8
    action_dim: 7
  dino:
    dino_backbone: dinov2_vits14
  reduce_in_full_precision: true
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /inspire/qb-ilm2/project/26summer-camp-10/public/inspire_shared/calvin_abc_d
    data_mix: calvin_task_ABC_D
    action_type: delta_qpos
    CoT_prompt: Your task is {instruction}. To identify the key objects for your task.
      Locate their bounding boxes in [x1,y1,x2,y2] format.
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av
    visual_augmentation:
      enabled: true
      crop_scale_min: 0.96
      brightness: 0.1
      contrast: 0.1
      saturation: 0.05
      blur_prob: 0.1
      blur_radius: 0.5
      noise_prob: 0.1
      noise_std: 2.0
      jpeg_prob: 0.1
      jpeg_quality_min: 80
      jpeg_quality_max: 95
    include_motion_history: true
    motion_history_window: 4
trainer:
  max_train_steps: 150000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 250
  learning_rate:
    base: 0.0001
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    motion_adapter: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface,action_model
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  vla_data:
    video_backend: torchvision_av
  pretrained_checkpoint: /inspire/qb-ilm2/project/26summer-camp-10/public/two/starVLA/results/Checkpoints/qwen35vl4b_gr00t_calvin_abc_d_strong_aug_from30000_new_lr_sched/checkpoints/steps_1000_pytorch_model.pt
  is_resume: false
config_yaml: ./examples/calvin/train_files/starvla_train_calvin.yaml
output_dir: ./results/Checkpoints/qwen35vl4b_gr00t_calvin_abc_d_strong_aug_from30000_new_lr_sched_steps1000_mot_adapter_only
