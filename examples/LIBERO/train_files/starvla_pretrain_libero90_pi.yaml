run_id: qwen35_pi_libero90
run_root_dir: ./results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Libero90_PI
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: /inspire/qb-ilm2/project/26summer-camp-10/public/two/Model/Qwen3.5-4B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /inspire/qb-ilm2/project/26summer-camp-10/public/two/data/LIBERO-datasets/lerobot
    data_mix: libero_90
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av
    visual_augmentation:
      enabled: true
      crop_scale_min: 0.96
      brightness: 0.10
      contrast: 0.10
      saturation: 0.05
      blur_prob: 0.10
      blur_radius: 0.5
      noise_prob: 0.10
      noise_std: 2.0
      jpeg_prob: 0.10
      jpeg_quality_min: 80
      jpeg_quality_max: 95

trainer:
  max_train_steps: 30000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 2.0e-06
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  save_format: pt

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
